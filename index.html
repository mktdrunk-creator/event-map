<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำหนดการลอยอังคารพี่หมู</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#f5efe7;color:#3e332b;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;
    }
    .wrap{max-width:480px;margin:auto;padding-bottom:28px}
    .hero{
      position:relative;height:390px;overflow:hidden;background:#ddd;
    }
    .hero img{width:100%;height:100%;object-fit:cover;display:block}
    .hero:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.02) 45%,rgba(45,29,18,.68) 100%);
    }
    .heroText{
      position:absolute;z-index:2;left:24px;right:24px;bottom:24px;color:#fff;
    }
    .heroText .small{font-size:14px;opacity:.92;margin-bottom:6px}
    .heroText h1{font-size:27px;line-height:1.25;margin:0;font-weight:700}
    .card{
      background:#fff;margin:-18px 16px 0;border-radius:20px;
      position:relative;z-index:3;padding:20px;
      box-shadow:0 8px 30px rgba(75,48,25,.12);
    }
    .date{
      text-align:center;background:#f8f0e7;border-radius:14px;padding:12px;
      font-weight:700;color:#76553e;margin-bottom:16px;
    }
    .event{
      border:1px solid #eadfd3;border-radius:16px;padding:16px;margin:12px 0;
      background:#fffdfb;
    }
    .time{font-size:25px;font-weight:800;color:#9a6b45}
    .title{font-size:18px;font-weight:700;margin:4px 0}
    .place{font-size:14px;color:#756960;line-height:1.5}
    .map{
      display:block;text-align:center;text-decoration:none;margin-top:12px;
      padding:11px;border-radius:11px;background:#4caf50;color:white;font-weight:700;
    }
    .share{
      width:100%;border:0;border-radius:13px;padding:15px;margin-top:8px;
      background:#06c755;color:white;font-size:17px;font-weight:800;cursor:pointer;
    }
    .note{text-align:center;color:#8c7d72;font-size:12px;margin-top:12px;line-height:1.5}
    .status{text-align:center;font-size:13px;margin-top:8px;color:#7d6d61;min-height:20px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="portrait.png" alt="ภาพระลึก">
    <div class="heroText">
      <div class="small">กำหนดการวันที่ 22 สิงหาคม 2569</div>
      <h1>กำหนดลอยอังคารพี่หมู</h1>
    </div>
  </div>

  <div class="card">
    <div class="date">วันเสาร์ที่ 22 สิงหาคม 2569</div>

    <div class="event">
      <div class="time">08:00 น.</div>
      <div class="title">ทำบุญตอนเช้า วัดภูเขาทอง</div>
      <div class="place">สถานที่ 1 · นัดหมายภารกิจช่วงเช้า</div>
      <a class="map" target="_blank" href="https://maps.app.goo.gl/xSPUcnf8KmCza1ND6">เปิด Google Maps</a>
    </div>

    <div class="event">
      <div class="time">12:30 น.</div>
      <div class="title">ท่าเรือ บ้านลิ้นช้าง</div>
      <div class="place">สถานที่ 2 · สำหรับภารกิจลอยอังคาร</div>
      <a class="map" target="_blank" href="https://maps.app.goo.gl/PiLwdYGvJ9mtPUdM7">เปิด Google Maps</a>
    </div>

    <button class="share" onclick="shareSchedule()">📤 แชร์กำหนดการให้เพื่อนใน LINE</button>
    <div id="status" class="status"></div>
    <div class="note">กดปุ่มแชร์ แล้วเลือกเพื่อนหรือกลุ่มใน LINE ได้เลย</div>
  </div>
</div>

<script>
const LIFF_ID = "2011118789-Cr9FZzwn";
const PAGE_URL = "https://liff.line.me/2011118789-Cr9FZzwn";

async function initLIFF(){
  try{
    await liff.init({liffId: LIFF_ID});
  }catch(e){
    console.log("LIFF init:", e);
  }
}
initLIFF();

async function shareSchedule(){
  const status = document.getElementById("status");
  status.textContent = "กำลังเปิดหน้าสำหรับเลือกเพื่อน...";

  try{
    if(!window.liff || !liff.isLoggedIn()){
      status.textContent = "กรุณาเปิดหน้านี้จาก LINE เพื่อใช้ปุ่มแชร์";
      return;
    }

    if(!liff.isApiAvailable("shareTargetPicker")){
      status.textContent = "อุปกรณ์หรือ LINE เวอร์ชันนี้ยังไม่รองรับการแชร์แบบเลือกเพื่อน";
      return;
    }

    const message = {
      type: "flex",
      altText: "กำหนดลอยอังคารพี่หมู วันที่ 22 สิงหาคม 2569",
      contents: {
        type: "bubble",
        size: "kilo",
        hero: {
          type: "image",
          url: "https://mktdrunk-creator.github.io/event-map/portrait.png",
          size: "full",
          aspectRatio: "4:5",
          aspectMode: "cover"
        },
        body: {
          type: "box",
          layout: "vertical",
          paddingAll: "18px",
          contents: [
            {
              type: "text",
              text: "กำหนดลอยอังคารพี่หมู",
              weight: "bold",
              size: "xl",
              wrap: true
            },
            {
              type: "text",
              text: "วันเสาร์ที่ 22 สิงหาคม 2569",
              size: "sm",
              color: "#8a7565",
              margin: "sm"
            },
            {
              type: "separator",
              margin: "lg"
            },
            {
              type: "box",
              layout: "vertical",
              margin: "lg",
              spacing: "sm",
              contents: [
                {
                  type: "text",
                  text: "08:00 น.  ทำบุญตอนเช้า วัดภูเขาทอง",
                  weight: "bold",
                  wrap: true
                },
                {
                  type: "button",
                  style: "link",
                  height: "sm",
                  action: {
                    type: "uri",
                    label: "เปิด Google Maps",
                    uri: "https://maps.app.goo.gl/xSPUcnf8KmCza1ND6"
                  }
                }
              ]
            },
            {
              type: "box",
              layout: "vertical",
              margin: "md",
              spacing: "sm",
              contents: [
                {
                  type: "text",
                  text: "12:30 น.  ท่าเรือ บ้านลิ้นช้าง",
                  weight: "bold",
                  wrap: true
                },
                {
                  type: "button",
                  style: "link",
                  height: "sm",
                  action: {
                    type: "uri",
                    label: "เปิด Google Maps",
                    uri: "https://maps.app.goo.gl/PiLwdYGvJ9mtPUdM7"
                  }
                }
              ]
            }
          ]
        },
        footer: {
          type: "box",
          layout: "vertical",
          spacing: "sm",
          contents: [
            {
              type: "button",
              style: "primary",
              color: "#06C755",
              action: {
                type: "uri",
                label: "เปิดกำหนดการ",
                uri: PAGE_URL
              }
            }
          ]
        }
      }
    };

    const result = await liff.shareTargetPicker([message]);
    if(result){
      status.textContent = "แชร์กำหนดการเรียบร้อยแล้ว";
    }else{
      status.textContent = "ปิดหน้าต่างเลือกผู้รับแล้ว";
    }
  }catch(e){
    console.error(e);
    status.textContent = "เกิดข้อผิดพลาดในการแชร์ กรุณาลองใหม่";
  }
}
</script>
</body>
</html>
