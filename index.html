<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กำหนดลอยอังคารพี่หมู</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f3f4f6;
      color: #222;
    }
    .card {
      width: min(100%, 430px);
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
      box-shadow: 0 2px 14px rgba(0,0,0,.08);
    }
    .hero {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .content { padding: 22px; }
    .eyebrow {
      color: #16a085;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      line-height: 1.3;
      margin: 0 0 18px;
    }
    .row {
      display: flex;
      gap: 12px;
      margin: 12px 0;
      line-height: 1.5;
    }
    .label {
      width: 62px;
      flex: 0 0 62px;
      color: #888;
      font-size: 14px;
    }
    .value {
      font-size: 15px;
      font-weight: 600;
    }
    .buttons { padding: 0 22px 24px; }
    button, a {
      width: 100%;
      display: block;
      border: 0;
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-top: 10px;
    }
    .map {
      background: #16a085;
      color: white;
    }
    .share {
      background: #111827;
      color: white;
    }
    #status {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 0 22px 18px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="hero" src="maxresdefault.jpg" alt="สถานที่จัดงาน">

    <section class="content">
      <div class="eyebrow">EVENT MAP</div>
      <h1>กำหนดลอยอังคารพี่หมู</h1>

      <div class="row">
        <div class="label">วันที่</div>
        <div class="value">22 สิงหาคม 2569</div>
      </div>

      <div class="row">
        <div class="label">เวลา</div>
        <div class="value">12:30 น.</div>
      </div>

      <div class="row">
        <div class="label">สถานที่</div>
        <div class="value">อาคารเฉลิมพระเกียรติ ร.3 บ้านลิ้นช้าง</div>
      </div>
    </section>

    <section class="buttons">
      <a class="map" href="https://maps.app.goo.gl/FSQxTPRwJHqhCj6H7" target="_blank" rel="noopener">
        📍 เปิด Google Maps
      </a>
      <button class="share" id="shareButton">
        📤 แชร์ให้เพื่อนใน LINE
      </button>
    </section>

    <div id="status"></div>
  </main>

<script>
  // หลังสร้าง LIFF App แล้ว ให้นำ LIFF ID มาแทนค่าด้านล่าง
  const LIFF_ID = "ใส่-LIFF-ID-ตรงนี้";

  const mapUrl = "https://maps.app.goo.gl/FSQxTPRwJHqhCj6H7";
  const imageUrl = new URL("maxresdefault.jpg", window.location.href).href;

  const flexMessage = {
    type: "flex",
    altText: "กำหนดลอยอังคารพี่หมู | 22 สิงหาคม 2569 เวลา 12:30 น.",
    contents: {
      type: "bubble",
      size: "kilo",
      hero: {
        type: "image",
        url: imageUrl,
        size: "full",
        aspectRatio: "16:9",
        aspectMode: "cover"
      },
      body: {
        type: "box",
        layout: "vertical",
        spacing: "md",
        paddingAll: "20px",
        contents: [
          {
            type: "text",
            text: "กำหนดลอยอังคารพี่หมู",
            size: "xl",
            weight: "bold",
            wrap: true
          },
          {
            type: "separator",
            margin: "lg"
          },
          {
            type: "box",
            layout: "vertical",
            margin: "lg",
            spacing: "md",
            contents: [
              {
                type: "box",
                layout: "baseline",
                contents: [
                  { type: "text", text: "วันที่", size: "sm", color: "#888888", flex: 2 },
                  { type: "text", text: "22 สิงหาคม 2569", size: "sm", weight: "bold", flex: 4, wrap: true }
                ]
              },
              {
                type: "box",
                layout: "baseline",
                contents: [
                  { type: "text", text: "เวลา", size: "sm", color: "#888888", flex: 2 },
                  { type: "text", text: "12:30 น.", size: "sm", weight: "bold", flex: 4 }
                ]
              },
              {
                type: "box",
                layout: "baseline",
                contents: [
                  { type: "text", text: "สถานที่", size: "sm", color: "#888888", flex: 2 },
                  { type: "text", text: "อาคารเฉลิมพระเกียรติ ร.3 บ้านลิ้นช้าง", size: "sm", weight: "bold", flex: 4, wrap: true }
                ]
              }
            ]
          }
        ]
      },
      footer: {
        type: "box",
        layout: "vertical",
        paddingAll: "15px",
        contents: [
          {
            type: "button",
            style: "primary",
            color: "#16A085",
            action: {
              type: "uri",
              label: "เปิด Google Maps",
              uri: mapUrl
            }
          }
        ]
      }
    }
  };

  const status = document.getElementById("status");
  const shareButton = document.getElementById("shareButton");

  async function setupLIFF() {
    if (LIFF_ID === "ใส่-LIFF-ID-ตรงนี้") {
      status.textContent = "หน้าเว็บพร้อมแล้ว รอใส่ LIFF ID หลังจากสร้าง LIFF App";
      return;
    }
    try {
      await liff.init({ liffId: LIFF_ID });
      status.textContent = "พร้อมแชร์ให้เพื่อนใน LINE";
    } catch (err) {
      console.error(err);
      status.textContent = "ไม่สามารถเริ่ม LIFF ได้ กรุณาตรวจสอบ LIFF ID และ Endpoint URL";
    }
  }

  shareButton.addEventListener("click", async () => {
    try {
      if (!liff.isInClient()) {
        alert("กรุณาเปิดหน้านี้ผ่าน LINE เพื่อใช้ปุ่มแชร์");
        return;
      }
      if (!liff.isApiAvailable("shareTargetPicker")) {
        alert("อุปกรณ์หรือ LINE เวอร์ชันนี้ยังไม่รองรับ Share Target Picker");
        return;
      }
      const result = await liff.shareTargetPicker([flexMessage]);
      if (result) {
        status.textContent = "แชร์การ์ดให้เพื่อนแล้ว";
      }
    } catch (err) {
      console.error(err);
      status.textContent = "ยกเลิกการแชร์หรือเกิดข้อผิดพลาด";
    }
  });

  setupLIFF();
</script>
</body>
</html>
